      <stop offset="0%" stop-color="#f7f6f5"/>
      <stop offset="50%" stop-color="#f0eeec"/>
      <stop offset="100%" stop-color="#faf9f8"/>
    </linearGradient>
    <linearGradient id="blob0" x1="20%" y1="20%" x2="95%" y2="95%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.9)"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <!-- Light theme — white / silver pebbles -->
  <defs>
